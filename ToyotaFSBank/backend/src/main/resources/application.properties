spring.application.name=ToyotaFSBank

# Server
server.port=8081

# H2 Database (in-memory, for local development)
spring.datasource.url=jdbc:h2:mem:toyotafsbankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info

# CORS - allow the Next.js frontend during local development
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3002

# Plaid - get sandbox credentials from https://dashboard.plaid.com/developers/keys
# Set these as real environment variables before starting the app, e.g.:
#   export PLAID_CLIENT_ID=... PLAID_SECRET=...
plaid.client-id=${PLAID_CLIENT_ID:}
plaid.secret=${PLAID_SECRET:}
plaid.env=${PLAID_ENV:sandbox}
plaid.products=${PLAID_PRODUCTS:transactions}
plaid.country-codes=${PLAID_COUNTRY_CODES:US}
plaid.redirect-uri=${PLAID_REDIRECT_URI:}
